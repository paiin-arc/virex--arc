services:
  - type: web
    name: virex-backend-paiin-arc
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # You can add other backend environment variables from your .env here
      # For example:
      # - key: CIRCLE_API_KEY
      #   value: YOUR_SECRET_API_KEY
